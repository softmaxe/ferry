name: CI

on:
  # No paths-ignore here: "Build and test" is a required check, so it must report on
  # every pull request. Docs-only pull requests skip the job instead (see `changes`).
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "demo/**"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!demo/**"

  check:
    name: Build and test
    needs: changes
    # A skipped job still satisfies the required check, so docs-only pull requests can merge.
    # Skip only when the filter ran and found no code changes; any other outcome runs the build.
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: bash
        # Passed through the environment so the Makefile still appends its own flags.
        env:
          CFLAGS: -O2 -Werror
        run: make all test
