name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "demo/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "demo/**"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: bash
        # Passed through the environment so the Makefile still appends its own flags.
        env:
          CFLAGS: -O2 -Werror
        run: make all test
