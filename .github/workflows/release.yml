name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: aarch64-apple-darwin
  EXPECTED_ARCH: arm64
  MINIMUM_MACOS: "26.0"

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version and validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = \(.*\)$/\1/p' Makefile | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Makefile version must match MAJOR.MINOR.PATCH: $version" >&2
            exit 1
          fi

          tag=""
          if [[ "$GITHUB_EVENT_NAME" = push && "$GITHUB_REF" = refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "Makefile version $version does not match tag $tag" >&2
              exit 1
            fi
          fi

          test -f LICENSE
          grep -q "The MIT License" LICENSE
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build aarch64-apple-darwin
    needs: validate
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          test "$actual_arch" = "$EXPECTED_ARCH" || {
            echo "Expected $EXPECTED_ARCH runner, got $actual_arch" >&2
            exit 1
          }
          sw_vers
          clang --version
          xcrun --show-sdk-version

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          make
          make test

      - name: Verify and package binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          binary="build/ferry"
          test -x "$binary"

          binary_archs="$(lipo -archs "$binary")"
          test "$binary_archs" = "$EXPECTED_ARCH" || {
            echo "Expected $EXPECTED_ARCH binary, got $binary_archs" >&2
            exit 1
          }

          minos="$(otool -l "$binary" | awk '$1 == "minos" { print $2; exit }')"
          test "$minos" = "$MINIMUM_MACOS" || {
            echo "Expected minimum macOS $MINIMUM_MACOS, got $minos" >&2
            exit 1
          }

          otool -L "$binary" | grep -q "/AppKit.framework/" || {
            echo "The binary must link AppKit" >&2
            exit 1
          }

          test "$("$binary" --version)" = "ferry $VERSION"

          package_dir="$RUNNER_TEMP/package-$TARGET"
          dist_dir="$RUNNER_TEMP/dist-$TARGET"
          mkdir -p "$package_dir" "$dist_dir"
          install -m 0755 "$binary" "$package_dir/ferry"
          install -m 0644 LICENSE "$package_dir/LICENSE"

          archive="ferry-v$VERSION-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$dist_dir/$archive" -C "$package_dir" ferry LICENSE
          (
            cd "$dist_dir"
            shasum -a 256 "$archive" > "$archive.sha256"
            shasum -a 256 -c "$archive.sha256"
          )

          archive_entries="$(tar -tzf "$dist_dir/$archive" | LC_ALL=C sort)"
          expected_entries="$(printf '%s\n' LICENSE ferry | LC_ALL=C sort)"
          test "$archive_entries" = "$expected_entries"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TARGET }}
          path: ${{ runner.temp }}/dist-${{ env.TARGET }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release files
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' \
            "ferry-v$VERSION-$TARGET.tar.gz" \
            "ferry-v$VERSION-$TARGET.tar.gz.sha256" | LC_ALL=C sort)"
          actual_files="$(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files" || {
            echo "Unexpected release file set:" >&2
            printf '%s\n' "$actual_files" >&2
            exit 1
          }
          (
            cd dist
            sha256sum -c -- *.sha256
          )

      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create draft and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$is_draft" = "true" || {
              echo "Release $TAG is already published and will not be overwritten" >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "$TAG"
          fi

          gh release upload "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          expected_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          actual_count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$actual_count" = "$expected_count"

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

  formula:
    name: Generate Homebrew formula
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate formula
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          arm_archive="ferry-v$VERSION-$TARGET.tar.gz"
          arm_sha="$(awk '{ print $1 }' "dist/$arm_archive.sha256")"

          mkdir -p formula
          cat > formula/ferry.rb <<EOF
          class Ferry < Formula
            desc "Move the focused macOS window to another Space"
            homepage "https://github.com/softmaxe/ferry"
            license "MIT"

            depends_on arch: :arm64
            depends_on macos: :tahoe

            on_macos do
              on_arm do
                url "https://github.com/softmaxe/ferry/releases/download/$TAG/$arm_archive"
                sha256 "$arm_sha"
              end
            end

            def install
              bin.install "ferry"
              prefix.install "LICENSE"
            end

            test do
              assert_equal "ferry #{version}", shell_output("#{bin}/ferry --version").strip
            end
          end
          EOF

          ruby -c formula/ferry.rb

      - name: Upload candidate formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: formula/ferry.rb
          if-no-files-found: error
          retention-days: 30

  formula-test:
    name: Test formula on arm64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release
      - formula
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Download candidate formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula

      - name: Install and test formula
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew tap-new softmaxe/release-test
          test_tap="$(brew --repository softmaxe/release-test)"
          install -m 0644 formula/ferry.rb "$test_tap/Formula/ferry.rb"

          brew audit --strict softmaxe/release-test/ferry
          brew install softmaxe/release-test/ferry
          brew test softmaxe/release-test/ferry

          installed_archs="$(lipo -archs "$(brew --prefix ferry)/bin/ferry")"
          test "$installed_archs" = "$EXPECTED_ARCH"

  tap-sync:
    name: Update Homebrew tap
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - release
      - formula
      - formula-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-ferry
      cancel-in-progress: false
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmaxe/homebrew-tap
          ref: main
          path: homebrew-tap
          # Credentials stay persisted here because the push below needs them,
          # and every step in this job is first-party shell.
          token: ${{ secrets.FERRY_HOMEBREW_UPDATER }}

      - name: Download tested formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula

      - name: Commit and push formula
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          cd homebrew-tap

          if [[ -f Formula/ferry.rb ]]; then
            current_version="$(sed -nE 's/.*-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Formula/ferry.rb | head -n 1)"
            if [[ -z "$current_version" ]]; then
              echo "Existing Formula/ferry.rb has no version" >&2
              exit 1
            fi
            newest_version="$(printf '%s\n' "$current_version" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$current_version" != "$VERSION" && "$newest_version" = "$current_version" ]]; then
              echo "Refusing to replace newer Formula $current_version with $VERSION" >&2
              exit 1
            fi
          fi

          install -m 0644 ../formula/ferry.rb Formula/ferry.rb

          status_paths="$(git status --porcelain=v1 --untracked-files=all | awk '{ print $2 }' | LC_ALL=C sort -u)"
          if [[ -n "$status_paths" && "$status_paths" != "Formula/ferry.rb" ]]; then
            echo "Unexpected Homebrew tap changes:" >&2
            git status --short >&2
            exit 1
          fi

          git add Formula/ferry.rb
          if git diff --cached --quiet; then
            echo "Formula/ferry.rb is already current"
            exit 0
          fi

          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Formula/ferry.rb"
          git diff --cached -- Formula/ferry.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ferry to $VERSION"
          git push origin HEAD:main
