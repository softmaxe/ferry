name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, publish, and test release
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ARCHIVE: ferry-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main" >&2
            exit 1
          }
          version="$(make -s print-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Makefile version must match MAJOR.MINOR.PATCH: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Makefile version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          clang --version
          xcrun --show-sdk-version

      - name: Build and test
        run: make test

      - name: Package binary
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir" dist
          install -m 0755 build/ferry "$package_dir/ferry"
          install -m 0644 LICENSE "$package_dir/LICENSE"

          cd dist
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C "$package_dir" ferry LICENSE
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: --max-http-header-size=32768
        with:
          subject-path: dist/*.tar.gz

      - name: Create draft and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$is_draft" = "true" || {
              echo "Release $GITHUB_REF_NAME is already published and will not be overwritten" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          sha="$(awk '{ print $1 }' "dist/$ARCHIVE.sha256")"

          mkdir -p formula
          cat > formula/ferry.rb <<EOF
          class Ferry < Formula
            desc "Move the focused macOS window to another Space"
            homepage "https://github.com/softmaxe/ferry"
            url "https://github.com/softmaxe/ferry/releases/download/$GITHUB_REF_NAME/$ARCHIVE"
            sha256 "$sha"
            license "MIT"

            depends_on arch: :arm64
            depends_on macos: :tahoe

            def install
              bin.install "ferry"
              prefix.install "LICENSE"
            end

            test do
              assert_equal "ferry #{version}", shell_output("#{bin}/ferry --version").strip
            end
          end
          EOF

      # Reuse this runner to avoid a second macOS queue wait. The release must
      # be public before Homebrew can validate its download URL.
      - name: Install and test formula
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew tap-new softmaxe/release-test
          test_tap="$(brew --repository softmaxe/release-test)"
          install -m 0644 formula/ferry.rb "$test_tap/Formula/ferry.rb"

          # Homebrew refuses to load formulae from a tap until they are trusted.
          brew trust --formula softmaxe/release-test/ferry
          brew audit --strict softmaxe/release-test/ferry
          brew install softmaxe/release-test/ferry
          brew test softmaxe/release-test/ferry

      - name: Upload tested formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: formula/ferry.rb
          if-no-files-found: error
          retention-days: 30

  tap-sync:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # The environment only admits v*.*.* tags, which scopes the tap token to releases.
    environment: homebrew-tap
    concurrency:
      group: homebrew-tap-ferry
      cancel-in-progress: false
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: softmaxe/homebrew-tap
          ref: main
          path: homebrew-tap
          # Persist credentials for the tap push below.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download tested formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula

      - name: Commit and push formula
        run: |
          set -euo pipefail
          cd homebrew-tap
          version="${GITHUB_REF_NAME#v}"

          if [[ -f Formula/ferry.rb ]]; then
            current_version="$(sed -nE 's/.*-v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Formula/ferry.rb | head -n 1)"
            if [[ -z "$current_version" ]]; then
              echo "Existing Formula/ferry.rb has no version" >&2
              exit 1
            fi
            newest_version="$(printf '%s\n' "$current_version" "$version" | sort -V | tail -n 1)"
            if [[ "$current_version" != "$version" && "$newest_version" = "$current_version" ]]; then
              echo "Refusing to replace newer Formula $current_version with $version" >&2
              exit 1
            fi
          fi

          install -m 0644 ../formula/ferry.rb Formula/ferry.rb
          git add Formula/ferry.rb
          if git diff --cached --quiet; then
            echo "Formula/ferry.rb is already current"
            exit 0
          fi
          git diff --cached

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ferry to $version"
          git push origin HEAD:main
